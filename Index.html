<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8f5;--card:#fff;--tx:#1d1b19;--mu:#6e6a64;--ac:#b4472b;--acf:#fff;--ln:#e5e0d9;--chip:#efe9e1;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--tx:#f1ece6;--mu:#a29c93;--ac:#e8845f;--acf:#1a0e08;--ln:#37322d;--chip:#2c2824;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--tx:#f1ece6;--mu:#a29c93;--ac:#e8845f;--acf:#1a0e08;--ln:#37322d;--chip:#2c2824;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:90px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 8px;z-index:5;border-bottom:1px solid var(--ln)}
h1{font:700 22px Georgia,serif;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font:13px system-ui;color:var(--mu)}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:none;border:0;background:var(--chip);color:var(--tx);padding:7px 12px;border-radius:99px;font:inherit;font-size:14px}
.chip.on{background:var(--ac);color:var(--acf)}
.row{display:block;width:100%;text-align:left;background:var(--card);border:0;border-bottom:1px solid var(--ln);padding:12px 14px;color:var(--tx);font:inherit}
.t{font-weight:600}.a{color:var(--mu);font-size:14px}
.tags{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;background:var(--chip);padding:2px 8px;border-radius:99px}
.tag.none{color:var(--mu);font-style:italic;background:none;padding-left:0}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--acf);border:0;border-radius:99px;padding:14px 20px;font:600 16px system-ui;box-shadow:0 4px 14px #0004}
.sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:10}
.sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 4px;font:700 18px Georgia,serif}
.btn{border:0;background:var(--ac);color:var(--acf);padding:11px 16px;border-radius:10px;font:600 15px system-ui;text-decoration:none;display:inline-block}
.btn.g{background:var(--chip);color:var(--tx)}.btn.d{background:none;color:#c0392b}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.opt input[type=checkbox]{width:22px;height:22px;flex:none}
.opt input[type=text]{flex:1}
.acts{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.empty{text-align:center;color:var(--mu);padding:40px 20px}
.k{display:inline-block;margin-left:6px;font:700 12px system-ui;background:var(--ac);color:var(--acf);padding:1px 7px;border-radius:6px;vertical-align:1px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.bn{font-size:12px;color:var(--ac);margin:-4px 0 6px;font-weight:600}
.ro .fab{display:none}
#rd{position:fixed;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}#rd[hidden]{display:none}
.rbar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--ln)}.rbar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.sp{display:flex;align-items:center;gap:4px;color:var(--tx)}.sp i{min-width:28px;text-align:center;font-style:normal;font-size:13px}
#rbody{flex:1;overflow:auto;background:#fff;color:#222}.dlr{display:flex;gap:8px;align-items:center;margin:6px 0 2px}
.rb2{flex-wrap:wrap;padding:6px 10px}.rb2 button[hidden],.sp[hidden]{display:none}
.cl{padding:2px 12px}.cw{display:inline-block;vertical-align:top;margin:0 .45em .3em 0;padding:1px 3px;border-radius:5px}.cw.on{background:#ffe3d6}
.ct{display:block;font:600 19px/1.25 Georgia,serif;color:#222}.cc{display:block;min-height:19px;font:700 15px/1.25 ui-monospace,Menlo,monospace;color:#b4472b}
#pal{flex-wrap:wrap;border-top:1px solid var(--ln);border-bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}#pal:not([hidden]){display:flex}#pal input{width:70px;padding:7px}
#txm{position:absolute;inset:0;background:var(--bg);z-index:3;padding:12px;display:none;flex-direction:column;gap:8px;color:var(--tx)}#txm:not([hidden]){display:flex}#txm textarea{flex:1;font:15px/1.5 ui-monospace,Menlo,monospace}
</style></head><body>

const KEY='songbook-v1';
let S=null,filter='all',query='',open=null;
function seed(){return{cats:['Upbeat','Slow / Ballad','Country','Singalong','Rock','NZ / Aus'],
 songs:SEED.split('\n').map((l,i)=>{const[a,t,f]=l.split('|');return{id:'s'+i,t,a,f,c:[]}}),n:1000}}
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):seed()}catch(e){S=seed()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pushData()}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url=f=>!f?'':/^https?:/.test(f)?f:'https://drive.google.com/file/d/'+f+'/view';
function render(){
 const un=S.songs.filter(s=>!s.c.length).length;
 let h=`<button class="chip ${filter==='all'?'on':''}" data-f="all">All ${S.songs.length}</button>
 <button class="chip ${filter==='none'?'on':''}" data-f="none">Uncategorised ${un}</button>`;
 S.cats.forEach(c=>{h+=`<button class="chip ${filter===c?'on':''}" data-f="${esc(c)}">${esc(c)} ${S.songs.filter(s=>s.c.includes(c)).length}</button>`});
 h+=`<button class="chip" data-f="__m">⚙ Categories</button>`;
 $('chips').innerHTML=h;
 const q=query.toLowerCase();
 const rows=S.songs.filter(s=>(filter==='all'||(filter==='none'?!s.c.length:s.c.includes(filter)))&&(s.t+' '+(s.a||'')).toLowerCase().includes(q))
  .sort((x,y)=>x.t.localeCompare(y.t));
 $('count').textContent=rows.length+' shown';pushView();
 $('list').innerHTML=rows.length?rows.map(s=>`<button class="row" data-s="${s.id}"><div class="t">${esc(s.t)}${s.k?` <span class="k">${esc(s.k)}</span>`:''}</div><div class="a">${esc(s.a||'')}</div>
  <div class="tags">${s.c.length?s.c.map(c=>`<span class="tag">${esc(c)}</span>`).join(''):'<span class="tag none">uncategorised</span>'}</div></button>`).join(''):'<div class="empty">No songs here yet.</div>';
}
function sheet(html,sid){$('panel').innerHTML=html;$('sheet').classList.add('show');shown=sid||null;pushView();
 if(RO){$('panel').querySelectorAll('input,textarea,button').forEach(e=>e.disabled=true);$('panel').querySelectorAll('a.btn').forEach(e=>e.remove())}
 const rb=$('panel').querySelector('[data-x=read]');if(rb){rb.disabled=false;rb.onclick=()=>readSong(shown)}}
function close(){$('sheet').classList.remove('show');shown=null;pushView()}
function songSheet(id){
 const s=S.songs.find(x=>x.id===id);open=id;
 sheet(`<h2>${esc(s.t)}</h2><div class="a">${esc(s.a||'')}</div>
 <label>Key</label><input data-k value="${esc(s.k)}" placeholder="e.g. G, Am, F#m" autocapitalize="characters">
 <div class="acts">${s.f?`<button class="btn" data-x="read">Read</button>`:''}<button class="btn g" data-x="edit">Edit</button><button class="btn d" data-x="del">Delete</button></div>
 ${S.cats.map(c=>`<label class="opt"><input type="checkbox" data-c="${esc(c)}" ${s.c.includes(c)?'checked':''}> ${esc(c)}</label>`).join('')}
 <div class="acts"><button class="btn g" data-x="close">Done</button></div>`,id);
}
function formSheet(s){
 open=s?s.id:null;
 sheet(`<h2>${s?'Edit song':'Add song'}</h2>
 <label>Title</label><input id="f_t" value="${esc(s?.t)}">
 <label>Artist</label><input id="f_a" value="${esc(s?.a)}">
 <label>Key</label><input id="f_k" value="${esc(s?.k)}" placeholder="e.g. G, Am, F#m">
 <label>Google Drive link to PDF (optional)</label><input id="f_f" value="${esc(s?.f&&url(s.f))}" placeholder="Paste share link">
 <div class="acts"><button class="btn" data-x="save">Save</button><button class="btn g" data-x="close">Cancel</button></div>`);
}
function catSheet(){
 sheet(`<h2>Categories</h2><div class="a">Rename or remove. Songs keep their tags when renamed.</div>
 ${S.cats.map((c,i)=>`<div class="opt"><input type="text" data-r="${i}" value="${esc(c)}"><button class="btn d" data-d="${i}">✕</button></div>`).join('')}
 <div class="opt"><input type="text" id="newcat" placeholder="New category"><button class="btn" data-x="addcat">Add</button></div>
 <label>Backup (copy this text somewhere safe; paste a backup here and tap Restore)</label>
 <textarea id="bk" rows="4">${esc(JSON.stringify(S))}</textarea>
 <div class="acts"><button class="btn g" data-x="restore">Restore</button><button class="btn" data-x="close">Done</button></div>`);
}
document.addEventListener('click',e=>{if(RO)return;
 const t=e.target.closest('button,[data-s]');if(!t){if(e.target===$('sheet'))close();return}
 if(t.dataset.f){if(t.dataset.f==='__m')return catSheet();filter=t.dataset.f;render()}
 else if(t.dataset.s)songSheet(t.dataset.s);
 else if(t.id==='add')formSheet();
 else if(t.dataset.d!==undefined){const c=S.cats[+t.dataset.d];S.cats.splice(+t.dataset.d,1);S.songs.forEach(s=>s.c=s.c.filter(x=>x!==c));if(filter===c)filter='all';save();catSheet();render()}
 else switch(t.dataset.x){
  case'close':close();render();break;
  case'edit':formSheet(S.songs.find(x=>x.id===open));break;
  case'del':if(t.dataset.sure){{const d=S.songs.find(x=>x.id===open);if(d&&d.f)(S.removed=S.removed||[]).push(d.f)}S.songs=S.songs.filter(x=>x.id!==open);save();close();render()}else{t.dataset.sure=1;t.textContent='Tap again to delete'}break;
  case'save':{const ti=$('f_t').value.trim();if(!ti)return;let f=$('f_f').value.trim();const m=f.match(/\/d\/([\w-]+)/);if(m)f=m[1];
   if(open){Object.assign(S.songs.find(x=>x.id===open),{t:ti,a:$('f_a').value.trim(),k:$('f_k').value.trim(),f})}else S.songs.push({id:'s'+(S.n++),t:ti,a:$('f_a').value.trim(),k:$('f_k').value.trim(),f,m:1,c:[]});
   save();close();render();break}
  case'addcat':{const v=$('newcat').value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);save();catSheet();render()}break}
  case'restore':try{const d=JSON.parse($('bk').value);if(d.cats&&d.songs){S=d;save();close();render()}}catch(_){$('bk').value='Invalid backup text'}break;
 }
});
document.addEventListener('change',e=>{if(RO)return;const t=e.target;
 if(t.dataset.c!==undefined){const s=S.songs.find(x=>x.id===open);s.c=t.checked?[...s.c,t.dataset.c]:s.c.filter(c=>c!==t.dataset.c);save()}
 if(t.dataset.k!==undefined){S.songs.find(x=>x.id===open).k=t.value.trim();save()}
 if(t.dataset.r!==undefined){const i=+t.dataset.r,old=S.cats[i],nw=t.value.trim();if(nw&&!S.cats.includes(nw)){S.cats[i]=nw;S.songs.forEach(s=>s.c=s.c.map(c=>c===old?nw:c));if(filter===old)filter=nw;save();render()}else t.value=old}
});
$('q').addEventListener('input',e=>{query=e.target.value;render()});
let RO=false,ready=false,shown=null,V={},viewT,dataT,lastTs='0',lastView='';
const gs=google.script.run;
function pushData(){if(RO||!ready)return;clearTimeout(dataT);dataT=setTimeout(()=>gs.saveState(JSON.stringify(S)),600)}
function pushView(){if(RO||!ready)return;clearTimeout(viewT);viewT=setTimeout(()=>gs.saveView(JSON.stringify({filter,query,shown:shown||''})),300)}
function applyView(){filter=V.filter||'all';query=V.query||'';$('q').value=query;render();if(V.shown&&S.songs.find(x=>x.id===V.shown))songSheet(V.shown);else{$('sheet').classList.remove('show')}}
function mergeSeed(){const bad={'1GVxsolCnsFpcJcQThJFb0LEWnZ-fxFGz':'1GFRpjnOAEQse0p7czijK8u2P1ISjQ80I'};S.songs.forEach(s=>{if(bad[s.f])s.f=bad[s.f]});S.removed=S.removed||[];const have=new Set(S.songs.map(x=>x.f));SEED.split('\n').forEach(l=>{const[a,t,f]=l.split('|');if(f&&!have.has(f)&&!S.removed.includes(f)){have.add(f);S.songs.push({id:'d'+(S.n++),t,a,f,c:[]})}});save()}
S={cats:[],songs:[],n:0};render();
const IDB={db:null,ready:null,get(k){return new Promise(r=>{if(!this.db)return r(null);try{const q=this.db.transaction('p').objectStore('p').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})},
 set(k,v){return new Promise(r=>{if(!this.db)return r();try{const t=this.db.transaction('p','readwrite');t.objectStore('p').put(v,k);t.oncomplete=()=>r();t.onerror=()=>r()}catch(e){r()}})}};
IDB.ready=new Promise(r=>{try{const q=indexedDB.open('songbook',1);q.onupgradeneeded=()=>q.result.createObjectStore('p');q.onsuccess=()=>{IDB.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
async function getPdf(f){await IDB.ready;const c=await IDB.get(f);if(c)return c;const b=await new Promise((ok,no)=>gs.withSuccessHandler(ok).withFailureHandler(no).getPdf(f));await IDB.set(f,b);return b}
let lib=null,raf=0,playing=false,speed=40,pos=0,lastT=0,curF='';
async function loadLib(){if(lib)return lib;await new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';e.onload=ok;e.onerror=no;document.head.appendChild(e)});
 const w=await(await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')).text();
 pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}));return lib=pdfjsLib}
function tick(t){if(!playing)return;if(lastT){pos+=speed*(t-lastT)/1000;$('rbody').scrollTop=pos}lastT=t;raf=requestAnimationFrame(tick)}
function play(){pos=$('rbody').scrollTop;playing=true;lastT=0;$('r_p').textContent='\u23f8';raf=requestAnimationFrame(tick)}
function stop(){playing=false;cancelAnimationFrame(raf);$('r_p').textContent='\u25b6'}
function showSpeed(){$('r_s').textContent=speed;try{localStorage.setItem('spd'+curF,speed)}catch(e){}}
async function readSong(id,fp){const s=S.songs.find(x=>x.id===id);if(!s||!s.f)return;
 if(/^https?:/.test(s.f)){window.open(s.f,'_blank');return}
 curF=s.f;stop();let sp=0;try{sp=+localStorage.getItem('spd'+s.f)}catch(e){}speed=sp||40;
 $('rd').hidden=false;$('r_t').textContent=s.t;showSpeed();const b=$('rbody');b.scrollTop=0;b.innerHTML='<div class="empty">Loading\u2026</div>';
 cur=s;tp=0;edit=false;sel=null;impArm=0;mode=(!fp&&s.ch&&s.ch.length)?'chart':'pdf';syncBar();$('pal').hidden=true;if(mode==='chart'){renderChart();return}
 try{const[L,b64]=await Promise.all([loadLib(),getPdf(s.f)]);const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const pdf=await L.getDocument({data:u}).promise;b.innerHTML='';const w=b.clientWidth,dpr=Math.min(devicePixelRatio||1,2);
  for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p),sc=w/pg.getViewport({scale:1}).width,v=pg.getViewport({scale:sc*dpr});
   const c=document.createElement('canvas');c.width=v.width;c.height=v.height;c.style.cssText='width:'+w+'px;display:block';b.appendChild(c);await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise}}
 catch(e){b.innerHTML='<div class="empty">Couldn\u2019t load this song. Check your connection.</div>'}}
$('r_x').onclick=()=>{stop();$('rd').hidden=true;$('pal').hidden=true;$('txm').hidden=true};
$('r_p').onclick=()=>playing?stop():play();
$('r_m').onclick=()=>{speed=Math.max(10,speed-10);showSpeed()};
$('r_a').onclick=()=>{speed=Math.min(200,speed+10);showSpeed()};
$('rbody').addEventListener('pointerdown',()=>{if(playing)stop()});
$('dl').onclick=async()=>{const fs=S.songs.map(x=>x.f).filter(f=>/^[\w-]{20,}$/.test(f||''));await IDB.ready;let n=0,bad=0;
 for(const f of fs){$('dlst').textContent=(++n)+' / '+fs.length;try{await getPdf(f)}catch(e){bad++}}
 $('dlst').textContent='Saved '+(fs.length-bad)+' songs'+(bad?' ('+bad+' failed)':'')};
let cur=null,mode='pdf',edit=false,sel=null,tp=0,impArm=0;
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const NI=n=>{const i=SH.indexOf(n);return i<0?FL.indexOf(n):i};
function keyInfo(k,n){const m=(k||'C').match(/^([A-G][#b]?)(m(?!aj))?/)||[];const r=Math.max(0,NI(m[1]||'C'));return{t:(r+(m[2]?3:0)+(n||0)+240)%12}}
const flats=n=>[5,10,3,8,1].includes(keyInfo(cur&&cur.k,n).t);
function tr(c){if(!c||!tp)return c||'';const L=flats(tp)?FL:SH;const f=r=>{const i=NI(r);return i<0?r:L[(i+tp+240)%12]};
 return c.split(' ').map(p=>p.replace(/^([A-G][#b]?)([^\/]*)(?:\/([A-G][#b]?))?$/,(m,r,x,b)=>f(r)+x+(b?'/'+f(b):''))).join(' ')}
const CH=/^[A-G][#b]?(?:maj|min|m|M|dim|aug|sus[24]?|add)?\d*(?:sus[24]?|add\d*)?(?:\/[A-G][#b]?)?$/;
function itemsToChart(pages){const out=[];
 pages.forEach(items=>{const rows=[];[...items].sort((a,b)=>b.y-a.y||a.x-b.x).forEach(it=>{let r=rows.find(r=>Math.abs(r.y-it.y)<3);if(!r)rows.push(r={y:it.y,t:[]});const re=/\S+/g;let m;while(m=re.exec(it.s))r.t.push({s:m[0],x:it.x+it.w*m.index/Math.max(1,it.s.length)})});
  rows.sort((a,b)=>b.y-a.y);rows.forEach(r=>r.t.sort((a,b)=>a.x-b.x));
  const gaps=rows.slice(1).map((r,i)=>rows[i].y-r.y).sort((a,b)=>a-b),sm=gaps[gaps.length>>2]||12;
  let pend=null,prevY=null;const flush=()=>{if(pend){out.push(pend.t.map(c=>['',c.s]));pend=null}};
  rows.forEach(r=>{if(prevY!==null&&prevY-r.y>sm*2.3){flush();out.push([])}prevY=r.y;
   if(r.t.every(t=>CH.test(t.s))){flush();pend=r;return}
   const ln=r.t.map(t=>[t.s,'']);
   if(pend){pend.t.forEach(c=>{let bi=0,bd=1e9;r.t.forEach((t,i)=>{const d=Math.abs(t.x-c.x);if(d<bd){bd=d;bi=i}});ln[bi][1]=ln[bi][1]?ln[bi][1]+' '+c.s:c.s});pend=null}
   out.push(ln)});flush()});
 return out}
const toText=ch=>ch.map(l=>l.map(w=>(w[1]?'['+w[1].replace(/ /g,'_')+']':'')+w[0]).join(' ')).join('\n');
const fromText=t=>t.split('\n').map(l=>l.trim()?l.trim().split(/\s+/).map(w=>{const m=w.match(/^\[([^\]]*)\](.*)$/);return m?[m[2],m[1].replace(/_/g,' ')]:[w,'']}):[]);
function syncBar(){const c=mode==='chart';$('r_c').textContent=c?'PDF':'Chart';$('r_e').hidden=RO||!c;$('r_e').textContent=edit?'Done':'Edit';$('r_tx').hidden=RO||!c;$('r_im').hidden=RO;$('r_im').textContent='Import from PDF';$('tpw').hidden=!c||edit;$('r_t2').textContent=tp>0?'+'+tp:tp}
function renderChart(){const b=$('rbody');
 if(!cur.ch||!cur.ch.length){b.innerHTML='<div class="empty">No chart yet.'+(RO?'':'<br>Tap <b>Import from PDF</b>, or <b>Text</b> to type or paste lyrics with chords.')+'</div>';return}
 b.innerHTML=cur.ch.map((ln,li)=>ln.length?'<div class="cl">'+ln.map((w,i)=>`<span class="cw${sel&&sel.l===li&&sel.i===i?' on':''}" data-l="${li}" data-i="${i}"><span class="ct">${esc(w[0])||'&nbsp;'}</span><span class="cc">${esc(tr(w[1]))||'&nbsp;'}</span></span>`).join('')+'</div>':'<div style="height:16px"></div>').join('')}
function showPal(){const p=$('pal');if(!edit||!sel){p.hidden=true;return}const t=keyInfo(cur.k,0).t,L=flats(0)?FL:SH,N=i=>L[(t+i)%12];
 const cs=[N(0),N(2)+'m',N(4)+'m',N(5),N(7),N(9)+'m',N(7)+'7'];
 p.innerHTML=cs.map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join('')+'<button class="chip" data-c="">\u2715</button><input id="pc" placeholder="other"><button class="chip" id="pok">OK</button>';p.hidden=false}
$('pal').addEventListener('click',e=>{const t=e.target.closest('button');if(!t||!sel)return;const c=t.id==='pok'?$('pc').value.trim():t.dataset.c;if(c===undefined)return;cur.ch[sel.l][sel.i][1]=c;save();renderChart()});
$('rbody').addEventListener('click',e=>{const w=e.target.closest('.cw');if(!edit||!w)return;sel={l:+w.dataset.l,i:+w.dataset.i};renderChart();showPal()});
$('r_c').onclick=()=>{stop();$('pal').hidden=true;edit=false;sel=null;if(mode==='chart'){readSong(cur.id,1)}else{mode='chart';syncBar();$('rbody').scrollTop=0;renderChart()}};
$('r_e').onclick=()=>{edit=!edit;sel=null;tp=0;stop();syncBar();renderChart();showPal()};
$('r_dn').onclick=()=>{tp=Math.max(-11,tp-1);syncBar();renderChart()};
$('r_up').onclick=()=>{tp=Math.min(11,tp+1);syncBar();renderChart()};
$('r_tx').onclick=()=>{$('txa').value=toText(cur.ch||[]);$('txm').hidden=false};
$('tx_no').onclick=()=>{$('txm').hidden=true};
$('tx_ok').onclick=()=>{cur.ch=fromText($('txa').value);save();$('txm').hidden=true;mode='chart';syncBar();renderChart()};
$('r_im').onclick=async()=>{if(cur.ch&&cur.ch.length&&!impArm){impArm=1;$('r_im').textContent='Tap again to replace';return}
 impArm=0;$('r_im').textContent='Importing\u2026';
 try{const[L,b64]=await Promise.all([loadLib(),getPdf(cur.f)]);const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const pdf=await L.getDocument({data:u}).promise,pages=[];
  for(let p=1;p<=pdf.numPages;p++){const tc=await(await pdf.getPage(p)).getTextContent();pages.push(tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width})))}
  cur.ch=itemsToChart(pages);if(!cur.ch.length)throw 0;save();mode='chart';edit=false;sel=null;stop();syncBar();$('rbody').scrollTop=0;renderChart()}
 catch(e){$('r_im').textContent='No text found in this PDF'}};
function note(t){const b=$('bn');b.textContent='\u25cf Live sharing on \u00b7 '+t}
function syncFolder(){gs.withSuccessHandler(list=>{if(!list||!list.length)return;const ids=new Set(list.map(x=>x.id)),have=new Set(S.songs.map(x=>x.f));let add=0;S.removed=S.removed||[];
 list.forEach(x=>{if(!have.has(x.id)&&!S.removed.includes(x.id)){const p=x.name.split(/\s+-\s+/);S.songs.push({id:'d'+(S.n++),t:(p.length>1?p.slice(1).join(' - '):p[0]).trim(),a:p.length>1?p[0].trim():'',f:x.id,c:[]});add++}});
 const keep=S.songs.filter(x=>x.m||!/^[\w-]{20,}$/.test(x.f||'')||ids.has(x.f)),rem=S.songs.length-keep.length;S.songs=keep;
 if(add||rem){save();render();note('+'+add+' new, '+rem+' removed')}else note('up to date')}).listSongs()}
function parse(s,d){try{return JSON.parse(s)}catch(e){return d}}
function poll(){gs.withSuccessHandler(r=>{if(!r)return;let ch=false;
 if(r.state&&r.ts!==lastTs){lastTs=r.ts;S=parse(r.state,S);ch=true}
 if(r.view!==lastView){lastView=r.view;V=parse(r.view,{});ch=true}
 if(ch)applyView()}).getShared(lastTs)}
gs.withSuccessHandler(r=>{
 if(r.owner){S=r.state?parse(r.state,seed()):(load(),S);if(!S.songs.length)S=seed();mergeSeed();ready=true;
  $('bn').textContent='\u25cf Live sharing on';$('bn').hidden=false;render();pushData();pushView();syncFolder()}
 else{RO=true;document.body.classList.add('ro');$('q').readOnly=true;
  S=parse(r.state,S);V=parse(r.view,{});lastTs=r.ts;lastView=r.view;
  $('bn').textContent='\u25cf Following live (view only)';$('bn').hidden=false;applyView();setInterval(poll,3000)}
}).withFailureHandler(()=>{load();mergeSeed();render()}).getBoot();
</script></body></html>
